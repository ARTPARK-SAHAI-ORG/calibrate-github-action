name: "Calibrate"
description: "Run Calibrate agent tests in CI — gate the build on failures or just report the numbers, and auto-comment on PRs."
author: "Calibrate"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  api-key:
    description: "Calibrate API key (sk_…). Store as a secret, e.g. secrets.CALIBRATE_API_KEY."
    required: true
  agents:
    description: "Agent names to run all linked tests for, separated by commas or newlines. Optional — if omitted, every agent in the account linked to the API key is run."
    required: false
  base-url:
    description: "Base URL of the Calibrate backend API. Optional — defaults to the hosted Calibrate backend."
    required: false
    default: "https://api.calibrate.artpark.ai"
  app-url:
    description: "Base URL of the Calibrate web UI, used to link runs in the PR comment/summary. Optional — defaults to the hosted Calibrate web UI."
    required: false
    default: "https://calibrate.artpark.ai"
  mode:
    description: "'gate' fails the job if any test fails; 'report' always succeeds and only prints the numbers; 'gate-if-worse' fails only if the pass rate is lower than the last recorded run (or an agent didn't finish)."
    required: false
    default: "gate"
  poll-interval:
    description: "Seconds between status polls."
    required: false
    default: "5"
  timeout:
    description: "Max seconds to wait for all runs to finish before giving up."
    required: false
    default: "1800"
  github-token:
    description: "Token used to post the PR comment. Defaults to the workflow token; needs pull-requests: write."
    required: false
    default: ${{ github.token }}

outputs:
  total:
    description: "Total number of test cases across all agents."
    value: ${{ steps.calibrate.outputs.total }}
  passed:
    description: "Total passed test cases."
    value: ${{ steps.calibrate.outputs.passed }}
  failed:
    description: "Total failed test cases."
    value: ${{ steps.calibrate.outputs.failed }}
  pass-rate:
    description: "Pass rate of this run as a percentage, over the agents that had a previous run to compare with. Empty unless mode is 'gate-if-worse' and a comparison was possible."
    value: ${{ steps.calibrate.outputs.pass-rate }}
  previous-pass-rate:
    description: "Pass rate of the last recorded run, as a percentage. Empty unless mode is 'gate-if-worse' and a comparison was possible."
    value: ${{ steps.calibrate.outputs.previous-pass-rate }}

runs:
  using: "composite"
  steps:
    # gate-if-worse only: read back what the last run recorded. The key never
    # matches exactly on purpose — restore-keys does a prefix match and returns
    # the most recently saved entry, since a cache key can't be overwritten.
    - name: Restore the last recorded run
      if: inputs.mode == 'gate-if-worse'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/calibrate-baseline.json
        key: calibrate-baseline-
        restore-keys: calibrate-baseline-

    - id: calibrate
      shell: bash
      env:
        CALIBRATE_API_KEY: ${{ inputs.api-key }}
        CALIBRATE_AGENTS: ${{ inputs.agents }}
        CALIBRATE_BASE_URL: ${{ inputs.base-url }}
        CALIBRATE_APP_URL: ${{ inputs.app-url }}
        CALIBRATE_MODE: ${{ inputs.mode }}
        CALIBRATE_POLL_INTERVAL: ${{ inputs.poll-interval }}
        CALIBRATE_TIMEOUT: ${{ inputs.timeout }}
        CALIBRATE_BASELINE_FILE: ${{ inputs.mode == 'gate-if-worse' && format('{0}/calibrate-baseline.json', runner.temp) || '' }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ${{ github.action_path }}/run.sh

    # Record this run's numbers, but only from the default branch, so a pull
    # request can't lower its own bar. No `always()`: if the step above failed,
    # this is skipped, so a bad run on the default branch doesn't become the new
    # normal.
    - name: Record this run
      if: inputs.mode == 'gate-if-worse' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/calibrate-baseline.json
        key: calibrate-baseline-${{ github.run_id }}
